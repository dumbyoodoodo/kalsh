services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kalshi
      POSTGRES_PASSWORD: kalshi
      POSTGRES_DB: kalshi_weather
    ports:
      - "5432:5432"
    volumes:
      # KALSHI_PG_DATA_DIR unset (default): Docker named volume, managed by
      # Docker Desktop on the internal disk. Set it to an ABSOLUTE path to
      # bind-mount the live database directory somewhere else instead.
      # WARNING: a live Postgres data directory needs a POSIX filesystem
      # (APFS, ext4). Do NOT point this at ExFAT/FAT32 external drives --
      # missing POSIX permissions and weak fsync semantics through Docker's
      # virtualization risk silent data corruption. For ExFAT drives, keep
      # the live DB here and copy pg_dump backups to the drive instead.
      - ${KALSHI_PG_DATA_DIR:-kalshi_weather_postgres_data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalshi -d kalshi_weather"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kalshi_weather_postgres_data:
