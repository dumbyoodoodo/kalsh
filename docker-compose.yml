services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kalshi
      POSTGRES_PASSWORD: kalshi
      POSTGRES_DB: kalshi_weather
    ports:
      - "5432:5432"
    volumes:
      - kalshi_weather_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalshi -d kalshi_weather"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kalshi_weather_postgres_data:
