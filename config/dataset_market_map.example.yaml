# Manual settlement-mapping OVERRIDES (Milestone 2b).
#
# Since Milestone 2b, market -> station/variable/date mappings are derived
# automatically by the settlement parser (settlement/parser.py,
# docs/adr/0005-settlement-resolution.md). This file is the manual override
# layer on top: entries here REPLACE the parsed mapping for the same market,
# and may add markets the parser could not resolve.
#
# Copy this file, point DATASET_MARKET_MAP_PATH at your copy, and record the
# audit trail (reason/author/added_on) for every override -- overridden
# markets are listed in the resolution report and the dataset manifest, and
# the file's content hash is recorded in every build manifest.
#
# variable: tmax_f for a daily-HIGH market, tmin_f for a daily-LOW market.
# station_id: must exist in weather/stations.py (e.g. "NYC").

markets:
  - market_ticker: KXHIGHNY-26JUL20-T85
    station_id: NYC
    variable: tmax_f
    target_date: 2026-07-20
    reason: example override -- replace with a real investigated case
    author: example-researcher
    added_on: 2026-07-21
