name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --no-editable --all-groups

      - name: Lint
        run: uv run --no-editable ruff check .

      - name: Type check
        run: uv run --no-editable mypy src

      - name: Test
        run: uv run --no-editable pytest -v
